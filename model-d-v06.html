<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#332419"><title>MODEL-D v0.6 | 地方競馬全頭監査</title><style>:root{color-scheme:dark;--bg:#251a14;--panel:#38291e;--line:#765c3d;--gold:#e8bf75;--ink:#f8ebd8;--muted:#cbb99d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans JP',sans-serif}header{background:#332419;border-bottom:2px solid var(--gold);padding:20px}h1{color:var(--gold);margin:0}main{max-width:1200px;margin:auto;padding:15px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:17px;margin-bottom:16px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}label{display:block;color:var(--muted);margin-bottom:5px}input,select,button{font:inherit;min-height:44px;border-radius:9px;padding:10px}input,select{background:#211812;color:var(--ink);border:1px solid #846744;width:100%}button{background:var(--gold);color:#24180e;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#59422d;color:var(--ink);border:1px solid #a48250}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.notice{padding:12px;border-left:4px solid var(--gold);background:#493321;white-space:pre-wrap}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #71583d;text-align:left;vertical-align:top}th{color:var(--gold)}.frame{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:5px;font-weight:bold;color:#111}.f1{background:white}.f2{background:#171717;color:white}.f3{background:#e43b3b;color:white}.f4{background:#3678dc;color:white}.f5{background:#ffdd45}.f6{background:#32a853;color:white}.f7{background:#ff9b3e}.f8{background:#f0a6cb}.bad{color:#ffaaaa}.warn{color:#ffda91}.ok{color:#b5e3b4}.small{color:var(--muted);font-size:.88rem}footer{text-align:center;padding:20px;color:var(--muted)}</style></head><body><header><h1>🐎 MODEL-D <small>v0.6</small></h1><div>🩺 地方競馬AI｜全頭データ監査</div><div class="small">ばんえい競馬は対象外・公式照合と予測は未実装</div></header><main><section class="panel"><h2>① レース設定</h2><div class="fields"><div><label for="day">開催日</label><input type="date" id="day"></div><div><label for="venue">競馬場</label><select id="venue"><option value="">選択してください</option><option>門別</option><option>盛岡</option><option>水沢</option><option>浦和</option><option>船橋</option><option>大井</option><option>川崎</option><option>金沢</option><option>笠松</option><option>名古屋</option><option>園田</option><option>姫路</option><option>高知</option><option>佐賀</option></select></div><div><label for="raceNo">レース</label><select id="raceNo"></select></div><div><label for="raceName">レース名</label><input id="raceName"></div><div><label for="start">発走時刻</label><input type="time" id="start"></div><div><label for="distance">距離(m)</label><input type="number" min="100" id="distance"></div><div><label for="track">馬場</label><select id="track"><option value="">未確認</option><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></div></div></section><section class="panel"><h2>② 出馬表CSV</h2><input type="file" id="file" accept=".csv,text/csv"><div class="actions"><button class="secondary" id="template">CSVひな形を保存</button><button class="secondary" id="clear">全頭クリア</button></div><details><summary>必要なCSV列名</summary><p class="small" id="columns"></p></details><div class="notice" id="loadStatus">CSV未読込</div></section><section class="panel"><h2>③ 全頭監査</h2><div class="actions"><button id="audit">全頭監査を実行</button><button class="secondary" id="exportJson">JSON保存</button><button class="secondary" id="exportCsv">CSV保存</button><button class="secondary" id="copy">監査結果コピー</button></div><p class="small">「入力形式上の異常なし」は実在照合済みを意味しません。未確認項目は独立して表示します。</p><div class="notice" id="auditStatus">未監査</div><p id="summary"></p><div class="scroll"><table><thead><tr><th>枠</th><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th><th>判定</th><th>指摘</th></tr></thead><tbody id="horses"></tbody></table></div></section><section class="panel"><h2>④ 開発・データ状態</h2><div class="notice">NAR自動取得：未実装 ／ 馬名・騎手の実在照合：未実装 ／ AI予測：未実装</div><p class="small">CSVの列数・重複・入力形式を検査。レース設定を変更した場合、古い監査結果は破棄します。</p></section></main><footer>MODEL-D v0.6 — 入力データ監査強化版</footer><script>'use strict';
const $=id=>document.getElementById(id),headers=['馬番','枠番','馬名','騎手','性齢','斤量','調教師','所属','馬体重','増減','人気','単勝オッズ','前走騎手','過去騎手','前走着順','前走距離','前走競馬場','前走不利','メモ'];let horses=[],results=[],sourceName='',auditAt=null,importWarnings=[];
for(let n=1;n<=12;n++)$('raceNo').add(new Option(n+'R',String(n)));const d=new Date();$('day').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('columns').textContent=headers.join('、');
function parseCsv(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"'){if(cell!=='')throw Error('引用符の位置が不正');q=true}else if(c===','){row.push(cell);cell=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(q)throw Error('引用符が閉じられていません');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function csvCell(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(name,data,mime){let url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}function meta(){return {date:$('day').value,venue:$('venue').value,race_no:$('raceNo').value,race_name:$('raceName').value,start_time:$('start').value,distance_m:$('distance').value,track_condition:$('track').value}}function filename(ext){return 'MODEL-D_'+($('day').value||'undated')+'_'+($('venue').value||'unknown')+'_'+$('raceNo').value+'R_'+ext}
function invalidate(){if(auditAt){results=[];auditAt=null;$('auditStatus').textContent='レース設定が変更されました。監査結果を破棄しました。再監査してください。';render()}}['day','venue','raceNo','raceName','start','distance','track'].forEach(id=>$(id).addEventListener('change',invalidate));
function numberCheck(v,integer,min,max){if(!v)return false;let n=Number(v);return Number.isFinite(n)&&(!integer||Number.isInteger(n))&&n>=min&&n<=max}
function inspect(h,count){let issues=[],alerts=[],unknown=[];const no=h['馬番'],frame=h['枠番'];if(!numberCheck(no,true,1,30))issues.push('馬番不正');if(!numberCheck(frame,true,1,8))issues.push('枠番不正');if(!h['馬名'])issues.push('馬名空欄');if(!h['騎手'])issues.push('騎手空欄');if(h['馬名']&&h['騎手']&&h['馬名']===h['騎手'])issues.push('馬名と騎手が同一（列ずれ疑い）');for(const [k,int,min,max] of [['人気',true,1,count],['単勝オッズ',false,1,100000],['斤量',false,30,80],['馬体重',true,200,800],['増減',true,-100,100],['前走着順',true,1,30],['前走距離',true,100,5000]]){if(h[k]&&!numberCheck(h[k],int,min,max))issues.push(k+'の数値異常')}if(!h['人気'])unknown.push('人気');if(!h['単勝オッズ'])unknown.push('単勝オッズ');if(!h['前走騎手'])unknown.push('前走騎手');if(!h['過去騎手'])unknown.push('過去騎乗履歴');let history=h['過去騎手'].split(/[／/、;；|]/).map(s=>s.trim()).filter(Boolean);if(h['騎手']&&h['前走騎手']&&h['騎手']!==h['前走騎手']&&history.includes(h['騎手']))alerts.push('騎手手戻り候補');if(/あり|有|不利|詰|出遅|接触/.test(h['前走不利']))alerts.push('前走不利の申告');if(numberCheck(h['前走距離'],true,100,5000)&&numberCheck($('distance').value,true,100,5000)&&Math.abs(Number(h['前走距離'])-Number($('distance').value))>=400)alerts.push('距離変更400m以上');if(/休養|転入|乗替|乗り替|復帰|馬場/.test(h['メモ']))alerts.push('メモ要調査');return {issues,alerts,unknown,status:issues.length?'入力異常・要修正':alerts.length?'要再監査':unknown.length?'未確認項目あり':'入力形式上の異常なし'}}
function render(){let t=$('horses');t.innerHTML='';horses.forEach((h,i)=>{let r=results[i],tr=document.createElement('tr'),f=Number(h['枠番']),cls=r?(r.issues.length?'bad':r.alerts.length?'warn':r.unknown.length?'warn':'ok'):'';tr.innerHTML='<td>'+(f>=1&&f<=8?'<span class="frame f'+f+'">'+f+'</span>':safe(h['枠番']))+'</td><td>'+safe(h['馬番'])+'</td><td>'+safe(h['馬名'])+'</td><td>'+safe(h['騎手'])+'</td><td>'+safe(h['人気'])+'</td><td>'+safe(h['単勝オッズ'])+'</td><td class="'+cls+'">'+safe(r?.status||'未監査')+'</td><td>'+safe(r?[...r.issues,...r.alerts,...r.unknown.map(x=>'未確認:'+x)].join('／'):'—')+'</td>';t.append(tr)});if(!horses.length)t.innerHTML='<tr><td colspan="8">CSVを読み込んでください。</td></tr>';$('summary').textContent='対象 '+horses.length+'頭 ／ 監査済 '+results.length+'頭 ／ 入力異常 '+results.filter(r=>r.issues.length).length+'頭 ／ 要再監査 '+results.filter(r=>!r.issues.length&&r.alerts.length).length+'頭 ／ 未確認項目あり '+results.filter(r=>!r.issues.length&&!r.alerts.length&&r.unknown.length).length+'頭'}
$('file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let rows=parseCsv(await f.text());if(rows.length<2)throw Error('ヘッダーと馬データが必要です');let names=rows.shift().map(s=>s.trim());if(new Set(names).size!==names.length)throw Error('列名が重複しています');for(let k of ['馬番','枠番','馬名','騎手'])if(!names.includes(k))throw Error('必須列なし：'+k);if(rows.length>30)throw Error('30頭を超えています');let wrong=rows.map((r,i)=>r.length===names.length?null:(i+2)+'行目 '+r.length+'/'+names.length+'列').filter(Boolean);if(wrong.length)throw Error('列数不一致：'+wrong.join('、'));let data=rows.map(r=>Object.fromEntries(headers.map(k=>[k,(r[names.indexOf(k)]??'').trim()])));horses=data;results=[];auditAt=null;sourceName=f.name;importWarnings=[];$('loadStatus').textContent=f.name+'：'+horses.length+'頭読込。列数一致。実在照合は未実施。';$('auditStatus').textContent='未監査';render()}catch(err){$('loadStatus').textContent='読込失敗：'+err.message}});
$('audit').onclick=()=>{if(!horses.length){$('auditStatus').textContent='監査対象なし';return}results=horses.map(h=>inspect(h,horses.length));let seen=new Map();horses.forEach((h,i)=>{let n=Number(h['馬番']);if(!numberCheck(h['馬番'],true,1,30))return;if(seen.has(n)){for(let j of [seen.get(n),i]){if(!results[j].issues.includes('馬番重複'))results[j].issues.push('馬番重複');results[j].status='入力異常・要修正'}}else seen.set(n,i)});auditAt=new Date().toISOString();$('auditStatus').textContent='監査完了：'+horses.length+'頭。※馬名・騎手の実在確認および公式出馬表照合は未実施。';render()};
$('template').onclick=()=>save('MODEL-D_CSVひな形.csv','\uFEFF'+headers.map(csvCell).join(',')+'\r\n','text/csv;charset=utf-8');$('clear').onclick=()=>{horses=[];results=[];auditAt=null;sourceName='';$('file').value='';$('loadStatus').textContent='CSV未読込';$('auditStatus').textContent='未監査';render()};function payload(){return {app:'MODEL-D',version:'0.6',rule_version:'v0.6-input-audit',source_file:sourceName,exported_at:new Date().toISOString(),audited_at:auditAt,model_prediction:'not_implemented',auto_fetch:'not_implemented',external_verification:'not_implemented',race:meta(),horses:horses.map((h,i)=>({data:h,audit:results[i]||null}))}}$('exportJson').onclick=()=>save(filename('audit.json'),JSON.stringify(payload(),null,2),'application/json;charset=utf-8');$('exportCsv').onclick=()=>{let cols=[...headers,'判定','入力異常','要再監査','未確認'];save(filename('audit.csv'),'\uFEFF'+[cols.map(csvCell).join(','),...horses.map((h,i)=>{let r=results[i]||{status:'未監査',issues:[],alerts:[],unknown:[]};return [...headers.map(k=>h[k]),r.status,r.issues.join('／'),r.alerts.join('／'),r.unknown.join('／')].map(csvCell).join(',')})].join('\r\n'),'text/csv;charset=utf-8')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(['MODEL-D v0.6',JSON.stringify(meta()),...horses.map((h,i)=>h['馬番']+' '+h['馬名']+' '+(results[i]?.status||'未監査'))].join('\n'));$('auditStatus').textContent='コピーしました'}catch{$('auditStatus').textContent='コピーに失敗しました'}};render();</script></body></html>
